# === KIDSFLOW production override (12-bo'lim) ===
# Ishlatish:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Bu override:
#   - CPU/memory limitlarini qo'yadi;
#   - postgres/redis/backend/frontend host portlarini yopadi (faqat nginx ochiq);
#   - restart policy'ni "always" qiladi;
#   - production sozlamalarini majburiy qiladi.
#
# DIQQAT — `ports: !reset []` dagi `!reset` teg majburiy. Compose ro'yxatlarni
# birlashtirganda `ports` ni ALMASHTIRMAY, QO'SHIB qo'yadi: oddiy `ports: []`
# yozilsa asosiy fayldagi portlar o'z holicha ochiq qolaveradi va bu override
# xavfsizlik haqida yolg'on tasavvur beradi (PostgreSQL internetga ochiq qoladi).
# O'zgartirgandan keyin doim tekshiring:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml config | grep published

services:
  postgres:
    restart: always
    ports: !reset []  # host'ga ochilmaydi (faqat ichki tarmoq)
    mem_limit: 1g
    cpus: 1.0

  redis:
    restart: always
    ports: !reset []
    mem_limit: 256m
    cpus: 0.5

  backend:
    restart: always
    # Host'ga ochilmaydi: barcha tashqi trafik nginx orqali o'tishi shart.
    # Aks holda 8000-port TLS'ni, nginx rate-limit zonasini va xavfsizlik
    # sarlavhalarini chetlab o'tib to'g'ridan-to'g'ri ochiq qolardi.
    ports: !reset []
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      # Rate limit sanog'i Redis'da — xotirada bo'lsa, ikkinchi backend nusxasi
      # qo'shilganda har nusxa o'z sanog'ini yuritib, limit amalda ikki barobar
      # bo'shashardi.
      RATE_LIMIT_BACKEND: redis
      # Productionda frontend va API bitta domenda (nginx orqali), shuning uchun
      # CORS umuman ishlatilmaydi. Lekin ro'yxatda lokal manzil qolib ketsa,
      # foydalanuvchining o'z mashinasidagi localhost:3000 sahifasi
      # production API'ga cookie/token bilan so'rov yuborib, javobini o'qiy
      # olardi. Shu sababli bu yerda o'z domeningiz turishi kerak.
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN ni .env da ko'rsating, masalan https://bogcha.uz}
      # Backend porti yopiq (yuqoridagi `ports: !reset []`), unga faqat ichki
      # tarmoqdagi nginx yeta oladi — shuning uchun X-Forwarded-For ga ishonish
      # xavfsiz.
      FORWARDED_ALLOW_IPS: "*"
    mem_limit: 768m
    cpus: 1.0

  worker:
    restart: always
    mem_limit: 512m
    cpus: 0.5

  telegram-bot:
    restart: always
    mem_limit: 256m
    cpus: 0.5

  frontend:
    restart: always
    build:
      context: ./frontend-web
      # Nisbiy yo'l: brauzer so'rovi frontend turgan domenga boradi, nginx uni
      # backendga uzatadi.
      #
      # Bu yerda ataylab `${NEXT_PUBLIC_API_BASE_URL:-...}` ishlatilmagan: compose
      # ildizdagi `.env` ni o'qiydi, u yerda esa lokal ishlash uchun
      # `http://localhost:8000/api/v1` turadi. O'zgaruvchi orqali berilsa, lokal
      # qiymat production build'iga sezdirmasdan kirib ketardi va deploy qilingan
      # sayt foydalanuvchining o'z kompyuteridagi 8000-portga murojaat qilardi.
      #
      # API alohida domenda bo'lsa, quyidagi qatorni qo'lda o'zgartiring.
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    ports: !reset []  # nginx orqali beriladi
    mem_limit: 512m
    cpus: 0.5

  nginx:
    restart: always
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Production TLS konfiguratsiyasi — alohida fayl. Ilgari TLS bloki
      # nginx.conf ichida izohga olingan holda turardi va uni chiqarish
      # deploy paytidagi qo'lda qadam edi; amalda unutilib, production
      # ochiq HTTP da ishlayverardi. Endi sertifikat bo'lmasa nginx ishga
      # tushmaydi va nosozlik darhol ko'rinadi.
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # Let's Encrypt HTTP-01 tekshiruvi shu katalogga fayl qo'yadi. Sertifikat
      # yangilanishi uchun doimiy kerak, faqat birinchi olishda emas.
      - ./nginx/certbot:/var/www/certbot:ro
