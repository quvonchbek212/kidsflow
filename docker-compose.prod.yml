# === KIDSFLOW production override (12-bo'lim) ===
# Ishlatish:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Bu override:
#   - CPU/memory limitlarini qo'yadi;
#   - postgres/redis host portlarini yopadi (faqat ichki tarmoq);
#   - restart policy'ni "always" qiladi;
#   - production sozlamalarini majburiy qiladi.

services:
  postgres:
    restart: always
    ports: []  # host'ga ochilmaydi (faqat ichki tarmoq)
    mem_limit: 1g
    cpus: 1.0

  redis:
    restart: always
    ports: []
    mem_limit: 256m
    cpus: 0.5

  backend:
    restart: always
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    mem_limit: 768m
    cpus: 1.0

  worker:
    restart: always
    mem_limit: 512m
    cpus: 0.5

  telegram-bot:
    restart: always
    mem_limit: 256m
    cpus: 0.5

  frontend:
    restart: always
    build:
      context: ./frontend-web
      # Nisbiy yo'l: brauzer so'rovi frontend turgan domenga boradi, nginx uni
      # backendga uzatadi.
      #
      # Bu yerda ataylab `${NEXT_PUBLIC_API_BASE_URL:-...}` ishlatilmagan: compose
      # ildizdagi `.env` ni o'qiydi, u yerda esa lokal ishlash uchun
      # `http://localhost:8000/api/v1` turadi. O'zgaruvchi orqali berilsa, lokal
      # qiymat production build'iga sezdirmasdan kirib ketardi va deploy qilingan
      # sayt foydalanuvchining o'z kompyuteridagi 8000-portga murojaat qilardi.
      #
      # API alohida domenda bo'lsa, quyidagi qatorni qo'lda o'zgartiring.
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    ports: []  # nginx orqali beriladi
    mem_limit: 512m
    cpus: 0.5

  nginx:
    restart: always
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
