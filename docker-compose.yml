# === KIDSFLOW development docker-compose ===
# Har bir bog'cha alohida deployment sifatida ishlaydi (loyiha strukturasi, 2.2-bo'lim).
# Ishga tushirish: `docker compose up -d --build`

name: kidsflow

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kidsflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kidsflow}
      POSTGRES_DB: ${POSTGRES_DB:-kidsflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kidsflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      FILE_STORAGE_PATH: /app/storage
      # Konteyner standart UTC bo'ladi. Taqvim hisoblari `today_local()` orqali
      # sozlamadagi zonani oladi, lekin log vaqtlari va har qanday e'tibordan
      # chetda qolgan `date.today()` ham to'g'ri kunni ko'rsatishi uchun.
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - file_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.workers.main"]
    # Backend image'idagi HEALTHCHECK `http://localhost:8000/health`ni tekshiradi.
    # Worker HTTP server emas, shuning uchun u tekshiruv doim yiqilib, konteyner
    # "unhealthy" bo'lib turadi. Meros qilib olingan tekshiruv o'chiriladi.
    healthcheck:
      disable: true
    env_file:
      - ./backend/.env
    environment:
      FILE_STORAGE_PATH: /app/storage
      # Konteyner standart UTC bo'ladi. Taqvim hisoblari `today_local()` orqali
      # sozlamadagi zonani oladi, lekin log vaqtlari va har qanday e'tibordan
      # chetda qolgan `date.today()` ham to'g'ri kunni ko'rsatishi uchun.
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - file_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  telegram-bot:
    build:
      context: ./telegram-bot
    restart: unless-stopped
    env_file:
      - ./telegram-bot/.env
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-web
      # NEXT_PUBLIC_* build vaqtida bundle ichiga yoziladi, shuning uchun bu
      # `args` bo'lishi shart — `environment` bilan berilsa hech qanday ta'sir
      # qilmaydi. Lokalda backend to'g'ridan-to'g'ri 8000-portda ochiq;
      # production'da docker-compose.prod.yml uni `/api/v1` ga o'zgartiradi
      # (so'rov nginx orqali o'tadi).
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # Antivirus. Ixtiyoriy: standart holda backend uni ishlatmaydi
  # (FILE_SCAN_ENABLED=false) va yuklangan fayllar PENDING deb belgilanadi.
  # Yoqish uchun backend/.env da FILE_SCAN_ENABLED=true qiling.
  #
  # Image ~1 GB va birinchi ishga tushishda virus bazasini yuklab oladi
  # (bir necha daqiqa), shuning uchun `profiles` ostida — oddiy
  # `docker compose up` uni ko'tarmaydi. Kerak bo'lganda:
  #   docker compose --profile antivirus up -d
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    profiles: ["antivirus"]
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  file_storage:
  clamav_data:
