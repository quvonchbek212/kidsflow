# === KIDSFLOW reverse proxy — FAQAT LOKAL ISHLASH UCHUN ===
#
# Bu fayl TLS'siz, chunki lokalda sertifikat yo'q.
#
# PRODUCTION uchun `nginx/nginx.prod.conf` ishlatiladi — u TLS bilan va
# docker-compose.prod.yml uni avtomatik ulaydi. Bu faylni productionga
# qo'ymang: unda HTTPS ham, HSTS ham yo'q.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;  # nginx versiyasini yashirish

    # Fayl yuklash limiti (12-bo'lim: upload limit).
    client_max_body_size 25m;

    # Rate limit zonasi — login/setup uchun qo'shimcha himoya (11-bo'lim).
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;

    # Asosiy xavfsizlik sarlavhalari.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    upstream backend_upstream {
        server backend:8000;
    }
    upstream frontend_upstream {
        server frontend:3000;
    }

    # DIQQAT: X-Forwarded-For mijoz yuborgan qiymatga QO'SHILMAYDI
    # ($proxy_add_x_forwarded_for emas), balki `$remote_addr` bilan QAYTA
    # YOZILADI. Aks holda foydalanuvchi o'zi X-Forwarded-For sarlavhasi bilan
    # kelib, uvicorn'ga soxta IP ko'rsatishi va login rate-limitini har so'rovda
    # yangi "IP" bilan aylanib o'tishi mumkin edi.
    server {
        listen 80;
        server_name _;

        # Let's Encrypt HTTP-01 tekshiruvi (certbot webroot). TLS yoqilganda ham
        # bu yo'l ochiq qolishi kerak — sertifikat shu orqali yangilanadi.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # === TLS yoqilgach quyidagi 3 qatorni izohdan chiqaring ===
        # Sertifikat olinmaguncha yo'naltirish o'chirilgan bo'lishi kerak, aks
        # holda sayt ishlamay qoladi (443 hali tinglanmaydi).
        # return 301 https://$host$request_uri;

        location ~ ^/api/v1/(auth/login|auth/refresh|setup)$ {
            limit_req zone=auth_zone burst=10 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # === Production TLS serveri ===
    #
    # Yoqish tartibi (docs/runbook.md, "TLS" bo'limi):
    #   1. certbot bilan sertifikat oling:
    #        certbot certonly --webroot -w ./nginx/certbot -d sizning-domen.uz
    #   2. fullchain.pem va privkey.pem ni ./nginx/certs/ ga qo'ying
    #   3. quyidagi blokni izohdan chiqaring va `server_name` ni to'ldiring
    #   4. yuqoridagi `return 301 https://...` qatorini ham izohdan chiqaring
    #   5. docker compose exec nginx nginx -t && docker compose restart nginx
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name sizning-domen.uz;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     location ~ ^/api/v1/(auth/login|auth/refresh|setup)$ {
    #         limit_req zone=auth_zone burst=10 nodelay;
    #         proxy_pass http://backend_upstream;
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Real-IP         $remote_addr;
    #         proxy_set_header X-Forwarded-For   $remote_addr;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    #
    #     location /api/ {
    #         proxy_pass http://backend_upstream;
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Real-IP         $remote_addr;
    #         proxy_set_header X-Forwarded-For   $remote_addr;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    #
    #     location / {
    #         proxy_pass http://frontend_upstream;
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Real-IP         $remote_addr;
