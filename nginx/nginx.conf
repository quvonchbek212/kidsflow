# === KIDSFLOW reverse proxy (12-bo'lim: TLS, security headers, upload limit) ===
#
# Production'da TLS sertifikatlari `./nginx/certs/` ga joylashtiriladi va
# docker-compose.prod.yml orqali /etc/nginx/certs ga ulanadi.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;  # nginx versiyasini yashirish

    # Fayl yuklash limiti (12-bo'lim: upload limit).
    client_max_body_size 25m;

    # Rate limit zonasi — login/setup uchun qo'shimcha himoya (11-bo'lim).
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;

    # Asosiy xavfsizlik sarlavhalari.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    upstream backend_upstream {
        server backend:8000;
    }
    upstream frontend_upstream {
        server frontend:3000;
    }

    # HTTP → HTTPS yo'naltirish (production'da TLS sertifikat bo'lsa).
    # Sertifikatlar yo'q bo'lsa, quyidagi 80-portli server bevosita xizmat qiladi.
    server {
        listen 80;
        server_name _;

        # --- Auth endpointlariga rate limit ---
        location ~ ^/api/v1/(auth/login|auth/refresh|setup)$ {
            limit_req zone=auth_zone burst=10 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API so'rovlari backendga.
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Qolgan barcha so'rovlar frontendga.
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # === Production TLS serveri (sertifikatlar mavjud bo'lganda yoqing) ===
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name your-domain.uz;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # ... yuqoridagi location bloklari bilan bir xil ...
    # }
}
