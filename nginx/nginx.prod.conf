# === KIDSFLOW production reverse proxy (TLS yoqilgan) ===
#
# `docker-compose.prod.yml` aynan shu faylni ulaydi. Lokal ishlash uchun
# `nginx.conf` ishlatiladi (u TLS'siz, chunki lokalda sertifikat yo'q).
#
# Ikki faylga ajratilganining sababi: ilgari TLS bloki bitta faylda izohga
# olingan holda turardi va uni izohdan chiqarish deploy paytida bajariladigan
# qo'lda qadam edi. Amalda bu qadam unutilib, production ochiq HTTP da
# ishlayverardi — parol ham, JWT ham, bolalarning tibbiy izohlari ham
# shifrlanmagan yo'ldan ketardi. Endi production konfiguratsiyasi TLS'siz
# umuman ishga tushmaydi: sertifikat bo'lmasa nginx xato bilan to'xtaydi va
# nosozlik darhol ko'rinadi.
#
# DEPLOYDAN OLDIN:
#   1. `server_name` ni o'z domeningizga o'zgartiring (ikki joyda).
#   2. Sertifikat oling:
#        docker compose run --rm --entrypoint "" -p 80:80 nginx \
#          certbot certonly --standalone -d sizning-domen.uz
#      yoki mavjud nginx ishlab turgan bo'lsa webroot orqali:
#        certbot certonly --webroot -w ./nginx/certbot -d sizning-domen.uz
#   3. fullchain.pem va privkey.pem ni ./nginx/certs/ ga qo'ying.
#   4. docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   5. Tekshiring: docker compose exec nginx nginx -t

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    client_max_body_size 25m;

    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;

    # Xavfsizlik sarlavhalari.
    #
    # DIQQAT: bu yerda Content-Security-Policy YO'Q va bo'lmasligi ham kerak.
    # Frontend CSP'si `frontend-web/middleware.ts` da har so'rovga yangi nonce
    # bilan beriladi; nginx bu yerda nonce'siz umumiy CSP qo'ysa, u Next.js
    # skriptlarini bloklab saytni butunlay ishdan chiqaradi. API javoblari
    # uchun CSP esa backend middleware'ida.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    upstream backend_upstream {
        server backend:8000;
    }
    upstream frontend_upstream {
        server frontend:3000;
    }

    # --- HTTP: faqat sertifikat yangilash va HTTPS ga yo'naltirish ---
    server {
        listen 80;
        server_name _;

        # Let's Encrypt HTTP-01 tekshiruvi. Sertifikat yangilanishi uchun
        # doimiy ochiq qolishi kerak, faqat birinchi olishda emas.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS ---
    server {
        listen 443 ssl;
        http2 on;
        server_name _;   # <-- o'z domeningizga o'zgartiring

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Brauzer bir marta HTTPS da kelgach, keyingi safar HTTP ga umuman
        # urinmaydi — bu birinchi so'rovni ushlab qolish hujumini yopadi.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;

        # X-Forwarded-For mijoz yuborgan qiymatga QO'SHILMAYDI
        # ($proxy_add_x_forwarded_for emas), balki $remote_addr bilan QAYTA
        # YOZILADI — aks holda foydalanuvchi soxta IP ko'rsatib login
        # rate-limitini har so'rovda aylanib o'ta olardi.
        location ~ ^/api/v1/(auth/login|auth/refresh|setup)$ {
            limit_req zone=auth_zone burst=10 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
